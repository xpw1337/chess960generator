<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess960 Generator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.cburnett.css">
  <style>
    :root {
      --bg: #161512;
      --panel: #262421;
      --text: #bababa;
      --heading: #e0e0e0;
      --muted: #8b8b8b;
      --light-sq: #f0d9b5;
      --dark-sq: #b58863;
      --accent: #629924;
      --accent-hover: #6fae2a;
      --secondary: #3692e7;
      --secondary-hover: #4aa0ee;
      --error: #cc3333;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 {
      color: var(--heading);
      font-weight: 400;
      font-size: 1.8rem;
      margin: 0 0 4px;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 24px;
      text-align: center;
    }

    .layout {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      max-width: 900px;
    }

    .board-wrap {
      width: min(560px, 100%);
    }

    .cg-wrap {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      aspect-ratio: 1;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
    }

    .square {
      position: relative;
      aspect-ratio: 1;
    }

    .square.light { background: var(--light-sq); }
    .square.dark { background: var(--dark-sq); }

    .cg-wrap piece {
      position: absolute;
      inset: 0;
      background-size: cover;
      transition: opacity 0.15s;
    }

    .coord {
      position: absolute;
      font-size: clamp(8px, 1.6vw, 12px);
      font-weight: 700;
      pointer-events: none;
      user-select: none;
    }

    .coord.rank { top: 2px; left: 3px; }
    .coord.file { bottom: 1px; right: 3px; }
    .square.light .coord { color: var(--dark-sq); }
    .square.dark .coord { color: var(--light-sq); }

    .panel {
      background: var(--panel);
      border-radius: 4px;
      padding: 20px;
      width: min(300px, 100%);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .position-number {
      font-size: 1.1rem;
      color: var(--heading);
    }

    .position-number span {
      font-size: 2rem;
      display: block;
    }

    button {
      font: inherit;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: none;
      border-radius: 4px;
      padding: 14px;
      color: #fff;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:disabled { opacity: 0.5; cursor: wait; }
    #generate { background: var(--accent); }
    #generate:hover:not(:disabled) { background: var(--accent-hover); }
    #check { background: var(--secondary); }
    #check:hover:not(:disabled) { background: var(--secondary-hover); }

    .result {
      min-height: 1.5em;
      line-height: 1.5;
    }

    .result.ok { color: var(--accent-hover); }
    .result.bad { color: var(--error); }

    .result ul {
      margin: 4px 0 0;
      padding-left: 20px;
    }

    a { color: var(--secondary); }

    .fen {
      font-family: Consolas, Menlo, monospace;
      font-size: 0.75rem;
      color: var(--muted);
      word-break: break-all;
    }

    footer {
      margin-top: 32px;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Chess960 Generator</h1>
  <p class="subtitle">Random Fischer Random Chess starting positions</p>

  <div class="layout">
    <div class="board-wrap">
      <div class="cg-wrap" id="board"></div>
    </div>

    <div class="panel">
      <div class="position-number">Position <span id="number">...</span></div>
      <button id="generate" disabled>Generate</button>
      <button id="check" disabled>Check board</button>
      <div class="result" id="result">Loading Python...</div>
      <a id="lichess" href="#" target="_blank" rel="noopener" hidden>Open on Lichess</a>
      <div class="fen" id="fen"></div>
    </div>
  </div>

  <footer>
    Boards are generated by the project's Python code, running in your browser.
    <br><a href="https://github.com/xpw1337/chess960generator">Source on GitHub</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
  <script>
    const FILES = "abcdefgh";
    const LETTERS = { king: "k", queen: "q", rook: "r", bishop: "b", knight: "n" };
    const KNIGHT_TABLE = ["11000", "10100", "10010", "10001", "01100", "01010", "01001", "00110", "00101", "00011"];

    const boardEl = document.getElementById("board");
    const numberEl = document.getElementById("number");
    const resultEl = document.getElementById("result");
    const fenEl = document.getElementById("fen");
    const lichessEl = document.getElementById("lichess");
    const generateBtn = document.getElementById("generate");
    const checkBtn = document.getElementById("check");

    let pyodide;

    function drawBoard(grid) {
      boardEl.innerHTML = "";
      // grid[0] is rank 8 (black's back rank), grid[7] is rank 1 (white's back rank)
      grid.forEach((row, r) => {
        const rank = 8 - r;
        row.forEach((cell, f) => {
          const square = document.createElement("div");
          square.className = "square " + ((r + f) % 2 === 0 ? "light" : "dark");

          const name = cell === "pawns" ? "pawn" : cell.trim();
          if (name) {
            const piece = document.createElement("piece");
            piece.className = name + " " + (r < 4 ? "black" : "white");
            square.appendChild(piece);
          }

          if (f === 0) square.insertAdjacentHTML("beforeend", `<span class="coord rank">${rank}</span>`);
          if (r === 7) square.insertAdjacentHTML("beforeend", `<span class="coord file">${FILES[f]}</span>`);
          boardEl.appendChild(square);
        });
      });
    }

    // Scharnagl numbering (0 to 959), the same numbers Lichess uses
    function positionNumber(backRank) {
      const light = backRank.findIndex((p, i) => p === "bishop" && i % 2 === 1);
      const dark = backRank.findIndex((p, i) => p === "bishop" && i % 2 === 0);
      const rest = backRank.filter((p, i) => i !== light && i !== dark);
      const queen = rest.indexOf("queen");
      const pattern = rest.filter(p => p !== "queen").map(p => (p === "knight" ? "1" : "0")).join("");
      return KNIGHT_TABLE.indexOf(pattern) * 96 + queen * 16 + (dark / 2) * 4 + (light - 1) / 2;
    }

    function toFen(backRank) {
      const black = backRank.map(p => LETTERS[p]).join("");
      const rooks = backRank.flatMap((p, i) => (p === "rook" ? [FILES[i]] : [])).reverse();
      const castling = rooks.join("").toUpperCase() + rooks.join("");
      return `${black}/pppppppp/8/8/8/8/PPPPPPPP/${black.toUpperCase()} w ${castling} - 0 1`;
    }

    function generate() {
      const grid = pyodide.runPython("current = Board()\ncurrent.grid").toJs();
      const backRank = grid[7];
      drawBoard(grid);
      numberEl.textContent = positionNumber(backRank);
      const fen = toFen(backRank);
      fenEl.textContent = fen;
      lichessEl.href = "https://lichess.org/analysis/chess960/" + fen.replace(/ /g, "_");
      lichessEl.hidden = false;
      resultEl.className = "result";
      resultEl.textContent = "";
    }

    function check() {
      const problems = pyodide.runPython("check_board(current)").toJs();
      if (problems.length === 0) {
        resultEl.className = "result ok";
        resultEl.textContent = "Valid Chess960 position.";
      } else {
        resultEl.className = "result bad";
        resultEl.innerHTML = "Invalid board:<ul>" + problems.map(p => `<li>${p}</li>`).join("") + "</ul>";
      }
    }

    async function main() {
      try {
        pyodide = await loadPyodide();
        // Load the project's own Python files into the in-browser Python
        for (const file of ["chess960_pos_gen.py", "checker.py"]) {
          const response = await fetch(file);
          if (!response.ok) throw new Error(`Could not load ${file}`);
          pyodide.FS.writeFile(file, await response.text());
        }
        pyodide.runPython("from chess960_pos_gen import Board\nfrom checker import check_board");

        generateBtn.disabled = false;
        checkBtn.disabled = false;
        generateBtn.addEventListener("click", generate);
        checkBtn.addEventListener("click", check);
        generate();
      } catch (err) {
        resultEl.className = "result bad";
        resultEl.textContent = "Failed to load: " + err.message;
      }
    }

    drawBoard(Array.from({ length: 8 }, () => Array(8).fill("     ")));
    main();
  </script>
</body>
</html>
